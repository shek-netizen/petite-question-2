<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffe4ef"><title>Une question pour toi ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;font-family:system-ui,sans-serif;color:#7f1d4e;background:linear-gradient(145deg,#fff0f6,#ffe0ed,#fff7fb)}.card{width:min(100%,520px);text-align:center;background:#ffffffdf;border:1px solid #ec489930;border-radius:28px;padding:clamp(24px,6vw,42px);box-shadow:0 24px 70px #be185d24}.heart{font-size:48px}h1{font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.3}p{line-height:1.6;color:#a04b75}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:25px}button{border:0;border-radius:999px;padding:14px 22px;font-size:1rem;font-weight:750;cursor:pointer;touch-action:manipulation}#yes{color:white;background:linear-gradient(135deg,#ec4899,#db2777);box-shadow:0 8px 20px #db277733}#no{color:#9d174d;background:white;border:1px solid #f9a8d4}.status{min-height:48px;margin-top:22px;font-weight:650;color:#9d174d;line-height:1.5}.note{font-size:.78rem;color:#b36a8b}
</style></head><body><main class="card"><div class="heart">💗🌷</div><h1>Veux-tu devenir ma girlfriend ? ❤️</h1><p>J’aimerais beaucoup qu’on soit ensemble. Qu’est-ce que tu en penses ? 🥹💖</p><div class="actions"><button id="yes">Oui, avec plaisir ❤️</button><button id="no">Désolée, non 💗</button></div><div class="status" id="status" role="status" aria-live="polite"></div><p class="note">Ta réponse ouvrira WhatsApp pour que tu puisses l’envoyer.</p></main>
<script>
// Remplace le numéro d'exemple par TON numéro WhatsApp international, chiffres uniquement, sans + ni espaces.
const WHATSAPP_NUMBER = "+2250595072295";
function sendAnswer(answer){const phone=WHATSAPP_NUMBER.replace(/\D/g,"");const example="2250701020304";const msg="Réponse à ta question « Veux-tu devenir ma girlfriend ? ❤️ » : "+answer;if(!phone||phone===example){document.getElementById("status").textContent="La page fonctionne ! Le créateur doit ajouter son numéro WhatsApp dans le fichier pour activer l’envoi.";return;}document.getElementById("status").textContent="WhatsApp s’ouvre avec ta réponse. Appuie sur Envoyer pour la transmettre. 💌";location.href="https://wa.me/"+phone+"?text="+encodeURIComponent(msg)}
document.getElementById("yes").addEventListener("click",()=>sendAnswer("Oui ❤️"));document.getElementById("no").addEventListener("click",()=>sendAnswer("Non 💗"));
</script></body></html>
